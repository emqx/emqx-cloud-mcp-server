name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build
      - run: python -m unittest -v
      - run: python -m build
      - run: emqx-cloud-mcp --help

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install . bandit pip-audit
      - run: bandit -q emqxcloud_mcp.py
      - name: Audit resolved runtime dependencies
        run: |
          python -c "import importlib.metadata as m; from pathlib import Path; names={d.metadata['Name']:d.version for d in m.distributions() if d.metadata['Name'].lower() != 'emqx-cloud-mcp-server'}; Path('audit-requirements.txt').write_text(''.join(f'{name}=={version}\n' for name,version in sorted(names.items())))"
          pip-audit --disable-pip --no-deps -r audit-requirements.txt
